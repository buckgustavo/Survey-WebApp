{% extends 'base.html' %}
{% block titulo %}Entrar - Survey App{% endblock %}
{% block conteudo %}
<div class="page-header">
    <div>
        <h1>Entrar</h1>
        <p>Acesse sua conta para participar</p>
    </div>
</div>
<div class="page-body" style="max-width:400px;">
    {% if erro %}<p style="color:#FCA5A5;margin-bottom:1rem;font-size:.875rem;">{{ erro }}</p>{% endif %}
    <form method="post">
        {% csrf_token %}
        <input type="hidden" name="proximo" value="{{ proximo }}">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" name="email" id="email" required autofocus placeholder="seu@email.com">
        </div>
        <div class="form-group" style="margin-bottom:1.5rem;">
            <label for="senha">Senha</label>
            <input type="password" name="senha" id="senha" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:.65rem;border-radius:9999px;font-size:.9375rem;">Entrar</button>
    </form>
    <p style="margin-top:1.25rem;text-align:center;color:var(--text-muted);font-size:.875rem;">
        Nao tem conta? <a href="{% url 'registro' %}" style="color:var(--accent);text-decoration:none;font-weight:600;">Criar conta</a>
    </p>
</div>
{% endblock %}
