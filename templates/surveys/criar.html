{% extends 'base.html' %}
{% block titulo %}Nova Pesquisa - Survey App{% endblock %}
{% block conteudo %}
<div class="page-header">
    <a href="{% url 'home' %}" class="back-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <div>
        <h1>Nova Pesquisa</h1>
        <p>1-10 questoes, 1-5 opcoes cada</p>
    </div>
</div>
<div class="page-body">
    {% if erro %}<p style="color:#FCA5A5;margin-bottom:1rem;font-size:.875rem;">{{ erro }}</p>{% endif %}
    <form method="post" id="form-pesquisa">
        {% csrf_token %}
        <div class="form-group">
            <label for="titulo">Titulo da Pesquisa</label>
            <input type="text" name="titulo" id="titulo" required value="{{ titulo|default:'' }}" placeholder="Ex: Satisfacao com o produto">
        </div>
        <hr class="divider">
        <div id="questoes-container"></div>
        <div style="margin-bottom:1.5rem;">
            <button type="button" id="btn-add-questao" class="btn btn-secondary">+ Adicionar Questao</button>
        </div>
        <div style="display:flex;gap:.75rem;">
            <button type="submit" class="btn btn-primary">Salvar Pesquisa</button>
            <a href="{% url 'home' %}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
let numQuestoes = 0;

function adicionarQuestao() {
    if (numQuestoes >= 10) { alert('Maximo de 10 questoes'); return; }
    numQuestoes++;
    const n = numQuestoes;
    const div = document.createElement('div');
    div.style.cssText = 'background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:1.25rem;margin-bottom:1rem;';
    div.id = `questao-bloco-${n}`;
    div.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
            <span style="font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);">Questao ${n}</span>
            <button type="button" onclick="removerQuestao(${n})" style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-family:inherit;font-size:.8rem;padding:.25rem .5rem;border-radius:6px;" onmouseover="this.style.color='#F87171'" onmouseout="this.style.color='var(--text-muted)'">Remover</button>
        </div>
        <div class="form-group">
            <label>Texto da questao</label>
            <input type="text" name="questao_${n}_texto" required placeholder="Digite a pergunta...">
        </div>
        <div id="opcoes-container-${n}" style="margin-bottom:.75rem;"></div>
        <button type="button" onclick="adicionarOpcao(${n})" style="width:100%;background:none;border:1px dashed var(--border);color:var(--text-muted);cursor:pointer;font-family:inherit;font-size:.8125rem;padding:.4rem;border-radius:8px;transition:border-color 150ms,color 150ms;" onmouseover="this.style.borderColor='var(--accent)';this.style.color='var(--accent)'" onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--text-muted)'">+ Opcao</button>
    `;
    document.getElementById('questoes-container').appendChild(div);
    adicionarOpcao(n); adicionarOpcao(n);
}

function removerQuestao(n) {
    const el = document.getElementById(`questao-bloco-${n}`);
    if (el) el.remove();
}

const numOpcoes = {};
function adicionarOpcao(q) {
    if (!numOpcoes[q]) numOpcoes[q] = 0;
    if (numOpcoes[q] >= 5) { alert('Maximo de 5 opcoes'); return; }
    numOpcoes[q]++;
    const m = numOpcoes[q];
    const div = document.createElement('div');
    div.style.cssText = 'display:flex;align-items:center;gap:.5rem;margin-bottom:.4rem;';
    div.innerHTML = `<span style="width:16px;height:16px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;"></span><input type="text" name="questao_${q}_opcao_${m}" required placeholder="Opcao ${m}" style="flex:1;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.4rem .75rem;color:var(--text);font-family:inherit;font-size:.875rem;">`;
    document.getElementById(`opcoes-container-${q}`).appendChild(div);
}

document.getElementById('btn-add-questao').addEventListener('click', adicionarQuestao);
adicionarQuestao();
</script>
{% endblock %}
